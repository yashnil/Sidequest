<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,300..900,0..100,0..1&family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=JetBrains+Mono:wght@400;600&display=block" rel="stylesheet">
<style>
body{margin:0;background:#efe9dd;font-family:'Bricolage Grotesque'}
.r{display:flex;gap:40px;align-items:center;padding:28px 40px;border-bottom:1px solid #0001}
.r.dark{background:#0d1a1f;color:#f1ebdf}
h3{font:600 11px 'JetBrains Mono';letter-spacing:.14em;text-transform:uppercase;opacity:.6;margin:0;width:130px}
.word{font-family:Fraunces;font-variation-settings:"opsz" 96,"SOFT" 100,"WONK" 0;font-weight:600;font-size:44px;letter-spacing:-0.025em;display:flex;align-items:center;gap:10px}
.icon{width:88px;height:88px;border-radius:22px;display:grid;place-items:center}
</style></head><body>
<script>
// S route: top-right start, through two bends, to a terminal waypoint that steps off the grid.
const P1 = 'M35 9 H19.5 a7.5 7.5 0 0 0 0 15 h9 a7.5 7.5 0 0 1 0 15 H12';
const mk = (stroke, dot, w=4.6, s=48, ring=false) => `<svg width="${s}" height="${s}" viewBox="0 0 48 48"><path d="${P1}" fill="none" stroke="${stroke}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>${ring?`<circle cx="35" cy="9" r="2.6" fill="none" stroke="${stroke}" stroke-width="1.8"/>`:''}<circle cx="9" cy="39" r="${w*1.05}" fill="${dot}"/></svg>`;
// variant 2: S with detour loop at the bottom terminal
const P2 = 'M35 9 H19.5 a7.5 7.5 0 0 0 0 15 h9 a7.5 7.5 0 0 1 0 15 H16';
const mk2 = (stroke, dot, s=48) => `<svg width="${s}" height="${s}" viewBox="0 0 48 48"><path d="${P2}" fill="none" stroke="${stroke}" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 39 C10 39 8 33 12 31" fill="none" stroke="${dot}" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="0.1 3.6"/><circle cx="12.5" cy="30.5" r="4.2" fill="${dot}"/></svg>`;
const rows = [
 ['V1 light', '', mk('#13222a','#ff5a1f'), '#13222a', '#ff5a1f'],
 ['V1 dark', 'dark', mk('#f1ebdf','#ff5a1f'), '#f1ebdf','#ff5a1f'],
 ['V2 detour', '', mk2('#13222a','#ff5a1f'), '#13222a','#ff5a1f'],
 ['V2 dark', 'dark', mk2('#f1ebdf','#ff5a1f'), '#f1ebdf','#ff5a1f'],
];
for (const [name, cls, mark, ink, dot] of rows) {
  const isV2 = name.startsWith('V2');
  const m = (s, stroke=ink, d=dot) => isV2 ? mk2(stroke, d, s) : mk(stroke, d, 4.6, s);
  document.write(`<div class="r ${cls}"><h3>${name}</h3>${m(120)}<div class="word">${m(40)}Sidequest</div>
  <div class="icon" style="background:#ff5a1f">${m(62,'#0d1a1f','#f1ebdf')}</div>
  <div class="icon" style="background:${cls?'#f1ebdf':'#13222a'}">${m(62, cls?'#13222a':'#f1ebdf', '#ff5a1f')}</div>
  ${m(32)}${m(16)}</div>`);
}
</script></body></html>
