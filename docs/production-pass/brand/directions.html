<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,300..900,0..100,0..1&family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=JetBrains+Mono:wght@400;600&display=block" rel="stylesheet">
<style>
body{margin:0;background:#efe9dd;font-family:'Bricolage Grotesque';display:grid;grid-template-columns:repeat(3,1fr);gap:0}
.cell{padding:40px;display:flex;flex-direction:column;gap:28px;align-items:flex-start;min-height:560px;box-sizing:border-box}
.dark{background:#0d1a1f;color:#f1ebdf}
h3{font:600 12px 'JetBrains Mono';letter-spacing:.14em;text-transform:uppercase;opacity:.6;margin:0}
.word{font-family:Fraunces;font-variation-settings:"opsz" 96,"SOFT" 50,"WONK" 1;font-weight:560;font-size:56px;letter-spacing:-0.02em;display:flex;align-items:center;gap:14px}
.row{display:flex;gap:24px;align-items:center}
.icon{width:96px;height:96px;border-radius:22px;display:grid;place-items:center}
</style></head><body>
<!-- A: Detour -->
<div class="cell"><h3>A · The detour</h3>
<svg width="220" height="120" viewBox="0 0 64 36"><path d="M2 28 H18 C24 28 24 8 32 8 C40 8 40 28 46 28 H62" fill="none" stroke="#13222a" stroke-width="3.2" stroke-linecap="round"/><circle cx="32" cy="8" r="5" fill="#ff5a1f"/></svg>
<div class="word"><svg width="44" height="26" viewBox="0 0 64 36"><path d="M2 28 H18 C24 28 24 8 32 8 C40 8 40 28 46 28 H62" fill="none" stroke="#13222a" stroke-width="4" stroke-linecap="round"/><circle cx="32" cy="8" r="6" fill="#ff5a1f"/></svg>Sidequest</div>
<div class="row"><div class="icon" style="background:#13222a"><svg width="64" height="40" viewBox="0 0 64 36"><path d="M2 28 H18 C24 28 24 8 32 8 C40 8 40 28 46 28 H62" fill="none" stroke="#f1ebdf" stroke-width="4" stroke-linecap="round"/><circle cx="32" cy="8" r="6" fill="#ff5a1f"/></svg></div></div>
</div>
<!-- B: Waymark S -->
<div class="cell dark"><h3>B · Waymark S</h3>
<svg width="140" height="140" viewBox="0 0 48 48"><path d="M36 10 H20 a8 8 0 0 0 0 16 h8 a8 8 0 0 1 0 16 H10" fill="none" stroke="#f1ebdf" stroke-width="4" stroke-linecap="round" stroke-dasharray="0.1 7.2"/><path d="M36 10 H20 a8 8 0 0 0 0 16 h8 a8 8 0 0 1 0 16 H10" fill="none" stroke="#f1ebdf" stroke-width="1.4" stroke-linecap="round" opacity=".35"/><circle cx="10" cy="42" r="4.5" fill="#ff5a1f"/><circle cx="36" cy="10" r="3" fill="none" stroke="#f1ebdf" stroke-width="1.6"/></svg>
<div class="word">Sidequest</div>
<div class="row"><div class="icon" style="background:#ff5a1f"><svg width="60" height="60" viewBox="0 0 48 48"><path d="M36 10 H20 a8 8 0 0 0 0 16 h8 a8 8 0 0 1 0 16 H10" fill="none" stroke="#0d1a1f" stroke-width="5" stroke-linecap="round"/><circle cx="36" cy="10" r="4" fill="#0d1a1f"/></svg></div></div>
</div>
<!-- C: Off-route pin -->
<div class="cell"><h3>C · Off the line</h3>
<svg width="140" height="140" viewBox="0 0 48 48"><path d="M4 40 L44 8" stroke="#13222a" stroke-width="2" stroke-dasharray="3 3" stroke-linecap="round"/><path d="M14 32 C12 18 22 10 32 14" fill="none" stroke="#ff5a1f" stroke-width="3.4" stroke-linecap="round"/><circle cx="32" cy="14" r="4.5" fill="#13222a"/><circle cx="32" cy="14" r="1.8" fill="#efe9dd"/></svg>
<div class="word" style="font-style:italic">Sidequest</div>
<div class="row"><div class="icon" style="background:#efe9dd;border:1.5px solid #13222a"><svg width="60" height="60" viewBox="0 0 48 48"><path d="M4 40 L44 8" stroke="#13222a" stroke-width="2.2" stroke-dasharray="3 3" stroke-linecap="round"/><path d="M14 32 C12 18 22 10 32 14" fill="none" stroke="#ff5a1f" stroke-width="4" stroke-linecap="round"/><circle cx="32" cy="14" r="5" fill="#13222a"/></svg></div></div>
</div>
</body></html>
